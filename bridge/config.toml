# WalkPad bridge config. Non-secret settings only (secrets go in .env).

[safety]
# Hard speed cap. The device's own max still applies if it is lower.
max_speed_kmh = 6.0
# Max speed change rate. Changes are sent in steps of max_ramp_kmh_per_s * ramp_tick_s.
max_ramp_kmh_per_s = 0.5
ramp_tick_s = 1.0
# If the pad connection drops, reconnect (up to this many tries) and stop the belt.
reconnect_attempts = 3
reconnect_backoff_s = 1.0
# While the bridge controls the belt: stop it if it stays above the cap this long.
above_cap_stop_s = 5.0

[ble]
# Default pad address for `live`/`inspect` (find it with `walkpad-bridge scan`). Empty: pass it on the CLI.
address = "57:4C:4E:36:10:BB"
# auto picks from the services the pad offers (FTMS preferred); or force "kingsmith" / "ftms".
protocol = "auto"
scan_timeout_s = 8.0
connect_timeout_s = 20.0
# KingSmith pads only report status when asked; this is how often we ask (min 0.5).
kingsmith_poll_s = 1.0
