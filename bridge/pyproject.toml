[project]
name = "walkpad-bridge"
version = "0.1.0"
description = "BLE bridge for a KingSmith WalkingPad: live data, safe belt control, session storage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "dbus-fast>=5.0.22 ; sys_platform == 'linux'",
    "fastapi>=0.142.2",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
walkpad-bridge = "walkpad_bridge.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
